<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
  <defs>
    <mask id="bezel-cutout">
      <rect width="1000" height="600" fill="white" />
      <rect x="30" y="30" width="940" height="540" rx="24" fill="black" />
    </mask>
    <linearGradient id="bezel-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151a20" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#0b0f14" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#05080c" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="bezel-chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#242a31" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#242a31" stop-opacity="0.86" />
    </linearGradient>
    <radialGradient id="bezel-highlight" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <linearGradient id="rim-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bezel-shade)" mask="url(#bezel-cutout)" />
  <rect width="1000" height="600" fill="url(#bezel-chrome)" mask="url(#bezel-cutout)" />
  <rect width="1000" height="600" fill="url(#bezel-highlight)" mask="url(#bezel-cutout)" />
  <rect x="28" y="28" width="944" height="544" rx="24" fill="none" stroke="url(#rim-highlight)" stroke-width="3" />
  <rect x="36" y="36" width="928" height="528" rx="22" fill="none" stroke="rgba(8, 12, 18, 0.75)" stroke-width="7" />
</svg>
